name: firmware

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download LEDE 17.01.7 ImageBuilder ar71xx
        working-directory: ${{ github.workspace }}
        run: |
          wget -q https://downloads.openwrt.org/releases/17.01.7/targets/ar71xx/generic/lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64.tar.xz
          tar xf lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64.tar.xz

      - name: Prepare files overlay
        run: |
          IB=$(ls -d lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64)
          mkdir -p "$IB/files/etc/config" "$IB/files/etc/init.d" \
                   "$IB/files/etc/uci-defaults" "$IB/files/usr/bin" "$IB/files/www/cgi-bin"
          cp tg-bot.sh "$IB/files/usr/bin/tg-bot.sh"
          cp tg-bot.init "$IB/files/etc/init.d/tg-bot"
          cp firmware/files/etc/config/tgbot "$IB/files/etc/config/tgbot"
          cp firmware/files/etc/uci-defaults/99-tgbot-setup "$IB/files/etc/uci-defaults/"
          cp firmware/files/www/cgi-bin/setup.cgi "$IB/files/www/cgi-bin/setup.cgi"
          chmod +x "$IB/files/www/cgi-bin/setup.cgi" "$IB/files/etc/init.d/tg-bot" \
                   "$IB/files/usr/bin/tg-bot.sh" "$IB/files/etc/uci-defaults/99-tgbot-setup"

      - name: Build firmware (no LuCI, tl-wr741nd-v4)
        working-directory: ${{ github.workspace }}
        run: |
          IB=$(ls -d lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64)
          cd "$IB"
          # 17.01: прибираємо PPPoE-стек (WAN=DHCP), IPv6-клієнт, UPnP; LuCI повний набір
          PKGS="curl libustream-mbedtls ca-bundle ca-certificates \
            -odhcp6c -ip6tables -libip6tc \
            -ppp -ppp-mod-pppoe -kmod-ppp -kmod-pppoe -kmod-pppox -kmod-slhc -luci-proto-ppp \
            -miniupnpd -luci-app-upnp -luci-lib-nixio -uboot-envtools -iw \
            -luci -luci-base -luci-compat -luci-mod-admin-full -luci-mod-network \
            -luci-mod-status -luci-mod-system -luci-app-firewall -luci-theme-bootstrap \
            -luci-lib-ip -luci-lib-jsonc"
          make image PROFILE=tl-wr741nd-v4 PACKAGES="$PKGS" FILES="files/" || {
            echo "::error::Image build failed (likely size overflow) — see log above"
            exit 1
          }

      - name: Collect artifacts
        run: |
          IB=$(ls -d lede-imagebuilder-17.01.7-ar71xx-generic.Linux-x86_64)
          mkdir -p artifacts
          find "$IB/bin/targets" -name '*.bin' -exec cp {} artifacts/ \;
          find "$IB/bin/targets" -name '*.manifest' -exec cp {} artifacts/ \;
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: tgbot-firmware-tl-wr741nd-v4
          path: artifacts/
