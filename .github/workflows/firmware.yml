name: firmware

on:
  workflow_dispatch:
    inputs:
      keep_luci:
        description: 'Keep LuCI in firmware'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ImageBuilder 19.07.10 ar71xx
        working-directory: ${{ github.workspace }}
        run: |
          wget -q https://downloads.openwrt.org/releases/19.07.10/targets/ar71xx/generic/openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64.tar.xz
          tar xf openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64.tar.xz

      - name: Prepare files overlay
        run: |
          IB=$(ls -d openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64)
          mkdir -p "$IB/files/etc/config" "$IB/files/etc/init.d" \
                   "$IB/files/etc/uci-defaults" "$IB/files/usr/bin" \
                   "$IB/files/bin" "$IB/files/www/cgi-bin"
          cp tg-bot.sh "$IB/files/usr/bin/tg-bot.sh"
          cp tg-bot.init "$IB/files/etc/init.d/tg-bot"
          cp firmware/files/etc/config/tgbot "$IB/files/etc/config/tgbot"
          cp firmware/files/etc/uci-defaults/99-tgbot-setup "$IB/files/etc/uci-defaults/"
          cp firmware/files/www/cgi-bin/setup.cgi "$IB/files/www/cgi-bin/setup.cgi"
          chmod +x "$IB/files/www/cgi-bin/setup.cgi" "$IB/files/etc/init.d/tg-bot" \
                   "$IB/files/usr/bin/tg-bot.sh" "$IB/files/bin/tgbot-curl" 2>/dev/null || true
          chmod +x "$IB/files/etc/uci-defaults/99-tgbot-setup"

      - name: Build firmware (no LuCI)
        working-directory: ${{ github.workspace }}
        run: |
          IB=$(ls -d openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64)
          cd "$IB"
          PROFILE=$(make info | grep -iE '^(tl-)?wr741|wr741nd' | head -1 | cut -d: -f1)
          echo "Detected profile: ${PROFILE:-NOT_FOUND}"
          [ -n "$PROFILE" ] || { make info | head -60; exit 1; }
          PKGS="+curl +libustream-mbedtls +ca-bundle +ca-certificates \
            -odhcp6c -ip6tables -libip6tc \
            -ppp -ppp-mod-pppoe -kmod-ppp -kmod-pppoe -kmod-pppox -kmod-slhc -luci-proto-ppp \
            -miniupnpd -luci-app-upnp -relayd -luci-proto-relay \
            -luci -luci-base -luci-compat -luci-mod-admin-full -luci-mod-network \
            -luci-mod-status -luci-mod-system -luci-app-firewall -luci-theme-bootstrap \
            -luci-lib-ip -luci-lib-jsonc -luci-lib-nixio -liblucihttp-lua -liblucihttp0 \
            -rpcd-mod-luci -rpcd-mod-file -rpcd-mod-iwinfo -rpcd-mod-rrdns -cgi-io \
            -libiwinfo-lua -uboot-envtools -iw"
          make image PROFILE="$PROFILE" PACKAGES="$PKGS" FILES="files/" || {
            echo "::error::Image build failed (likely size overflow) — see log above"
            exit 1
          }

      - name: Collect artifacts
        run: |
          IB=$(ls -d openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64)
          mkdir -p artifacts
          find "$IB/bin/targets" -name '*.bin' -exec cp {} artifacts/ \;
          find "$IB/bin/targets" -name '*.manifest' -exec cp {} artifacts/ \;
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: tgbot-firmware-tl-wr741nd-v4
          path: artifacts/
